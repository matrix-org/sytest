# GitHub actions workflow which builds and publishes the docker images.

name: Build and deploy docker images

on:
  push:
    branches: [develop]
  schedule:
    - cron: 0 1 * * *  # 1am, daily.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sytest-images:
    name: "Build sytest:${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: bookworm
            build_args: "BASE_IMAGE=debian:bookworm"
          - tag: testing
            build_args: |
              BASE_IMAGE=debian:testing
              POSTGRESQL_VERSION=18
    steps:
      - name: Set up QEMU
        id: QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Inspect builder
        run: docker buildx inspect

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          labels: "gitsha1=${{ github.sha }}"
          file: docker/base.Dockerfile
          build-args: ${{ matrix.build_args }}
          tags: matrixdotorg/sytest:${{ matrix.tag }}

  build-dependent-images:
    needs: build-sytest-images
    name: "Build sytest-${{ matrix.dockerfile }}:${{ matrix.sytest_image_tag }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - sytest_image_tag: bookworm
            dockerfile: synapse
            tags: "matrixdotorg/sytest-synapse:bookworm"
            build_args: "SYTEST_IMAGE_TAG=bookworm"
          - sytest_image_tag: testing
            dockerfile: synapse
            tags: "matrixdotorg/sytest-synapse:testing"
            build_args: |
              SYTEST_IMAGE_TAG=testing
              PYTHON_VERSION=3.13

    steps:
      - name: Set up QEMU
        id: QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Inspect builder
        run: docker buildx inspect

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          labels: "gitsha1=${{ github.sha }}"
          file: docker/${{ matrix.dockerfile }}.Dockerfile
          build-args: ${{ matrix.build_args }}
          tags: ${{ matrix.tags }}
